app = "pickleball-manager"
primary_region = "iad"
# Thời gian chờ tắt êm (entrypoint chuyển SIGTERM cho backend + bot)
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  DATABASE_URL = "sqlite:////data/clb.db"
  BACKUP_KEEP = "14"

[http_service]
  internal_port = 8000
  force_https = true
  # Bot Telegram dùng long-polling nên máy phải luôn chạy
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # Health check: backend treo (không thoát) sẽ bị Fly phát hiện và khởi động lại
  [[http_service.checks]]
    grace_period = "40s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "clb_data"
  destination = "/data"
  initial_size = "1gb"
